<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-container": "#fffbff",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed": "#001a42",
                    "on-error": "#ffffff",
                    "on-tertiary-fixed": "#311400",
                    "error": "#ba1a1a",
                    "surface-dim": "#d3daef",
                    "outline": "#727785",
                    "surface": "#f9f9ff",
                    "inverse-on-surface": "#edf0ff",
                    "on-primary": "#ffffff",
                    "background": "#f9f9ff",
                    "on-tertiary-fixed-variant": "#723600",
                    "primary-fixed": "#d8e2ff",
                    "secondary": "#4648d4",
                    "on-tertiary-container": "#fffbff",
                    "error-container": "#ffdad6",
                    "surface-variant": "#dce2f7",
                    "primary-fixed-dim": "#adc6ff",
                    "tertiary-container": "#b75b00",
                    "on-background": "#141b2b",
                    "surface-container-low": "#f1f3ff",
                    "secondary-fixed-dim": "#c0c1ff",
                    "on-primary-container": "#fefcff",
                    "inverse-surface": "#293040",
                    "tertiary": "#924700",
                    "on-surface-variant": "#424754",
                    "surface-container-lowest": "#ffffff",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#e1e0ff",
                    "on-secondary-fixed": "#07006c",
                    "surface-container-high": "#e1e8fd",
                    "inverse-primary": "#adc6ff",
                    "primary-container": "#2170e4",
                    "surface-tint": "#005ac2",
                    "on-primary-fixed-variant": "#004395",
                    "on-secondary-fixed-variant": "#2f2ebe",
                    "primary": "#0058be",
                    "surface-container": "#e9edff",
                    "tertiary-fixed": "#ffdcc6",
                    "surface-bright": "#f9f9ff",
                    "on-surface": "#141b2b",
                    "outline-variant": "#c2c6d6",
                    "surface-container-highest": "#dce2f7",
                    "tertiary-fixed-dim": "#ffb786",
                    "secondary-container": "#6063ee",
                    "on-tertiary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "24px",
                    "gutter": "12px",
                    "xl": "32px",
                    "md": "16px",
                    "sm": "8px",
                    "base": "4px",
                    "xs": "4px",
                    "container-margin": "20px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "headline-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-md-mobile": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f9f9ff;
            color: #141b2b;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom micro-interactions */
        .btn-hover-effect:active {
            transform: scale(0.98);
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Atmospheric Background Decoration -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-container/10 rounded-full blur-3xl" style="transform: translate(-0.34px, 3.73px);"></div>
<div class="absolute top-1/2 -right-24 w-64 h-64 bg-secondary-container/10 rounded-full blur-3xl" style="transform: translate(-0.34px, 3.73px);"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-md px-container-margin">
<!-- Header / Identity Section -->
<header class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary text-on-primary mb-md shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-4xl" data-icon="lock_reset">lock_reset</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-background tracking-tight mb-sm">Forgot password?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                No worries, we'll send you reset instructions to your inbox.
            </p>
</header>
<!-- Transactional Card -->
<section class="bg-surface-container-lowest rounded-xl p-lg shadow-[0_10px_15px_rgba(17,24,39,0.05)] border border-outline-variant/30">
<form class="space-y-lg" id="forgotPasswordForm">
<!-- Email Field -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant ml-base" for="email">
                        Email Address
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-[48px] pr-md py-md bg-surface border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="email" name="email" placeholder="Enter your email" required="" type="email">
</div>
</div>
<!-- Primary CTA -->
<button class="btn-hover-effect w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-md px-lg rounded-xl shadow-md hover:bg-on-primary-fixed-variant transition-all duration-200 flex items-center justify-center gap-sm" type="submit">
                    Reset Password
                </button>
</form>
<!-- Back to Login -->
<div class="mt-xl text-center">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                    Back to Login
                </a>
</div>
</section>
<!-- Illustration / Visual Anchor -->

</main>
<!-- Footer Space -->
<footer class="mt-auto py-lg">
<p class="font-label-md text-label-md text-outline-variant">
            © 2024 Todo Inc. All rights reserved.
        </p>
</footer>
<script>
        // Simple micro-interaction for form submission
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            
            // Loading State
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Sending...';
            
            setTimeout(() => {
                // Success State Simulation
                btn.classList.replace('bg-primary', 'bg-tertiary-container');
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Link Sent!';
                
                // Muted reset after 3 seconds
                setTimeout(() => {
                    btn.disabled = false;
                    btn.classList.replace('bg-tertiary-container', 'bg-primary');
                    btn.innerHTML = originalText;
                }, 3000);
            }, 1500);
        });

        // Add a subtle parallax effect to the background blobs
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelectorAll('.blur-3xl').forEach(blob => {
                blob.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>


</body></html>
