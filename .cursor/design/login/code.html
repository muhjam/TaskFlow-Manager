<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Todo - Login</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

          extend: {

                    "on-error": "#ffffff",
                    "on-tertiary-fixed": "#311400",
                    "error": "#ba1a1a",
                    "surface-dim": "#d3daef",
                    "outline": "#727785",
                    "surface": "#f9f9ff",
                    "inverse-on-surface": "#edf0ff",
                    "on-primary": "#ffffff",
                    "background": "#f9f9ff",
                    "on-tertiary-fixed-variant": "#723600",
                    "primary-fixed": "#d8e2ff",
                    "secondary": "#4648d4",
                    "on-tertiary-container": "#fffbff",
                    "error-container": "#ffdad6",
                    "surface-variant": "#dce2f7",
                    "primary-fixed-dim": "#adc6ff",
                    "tertiary-container": "#b75b00",
                    "on-background": "#141b2b",
                    "surface-container-low": "#f1f3ff",
                    "secondary-fixed-dim": "#c0c1ff",
                    "on-primary-container": "#fefcff",
                    "inverse-surface": "#293040",
                    "tertiary": "#924700",
                    "on-surface-variant": "#424754",
                    "surface-container-lowest": "#ffffff",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#e1e0ff",
                    "on-secondary-fixed": "#07006c",
                    "surface-container-high": "#e1e8fd",
                    "inverse-primary": "#adc6ff",
                    "primary-container": "#2170e4",
                    "surface-tint": "#005ac2",
                    "on-primary-fixed-variant": "#004395",
                    "on-secondary-fixed-variant": "#2f2ebe",
                    "primary": "#0058be",
                    "surface-container": "#e9edff",
                    "tertiary-fixed": "#ffdcc6",
                    "surface-bright": "#f9f9ff",
                    "on-surface": "#141b2b",
                    "outline-variant": "#c2c6d6",
                    "surface-container-highest": "#dce2f7",
                    "tertiary-fixed-dim": "#ffb786",
                    "secondary-container": "#6063ee",
                    "on-tertiary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "24px",
                    "gutter": "12px",
                    "xl": "32px",
                    "md": "16px",
                    "sm": "8px",
                    "base": "4px",
                    "xs": "4px",
                    "container-margin": "20px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "headline-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-md": ["Inter"],
                    "display-lg": ["Inter"],

            },
            "fontSize": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #F9FAFB; /* Level 0 Flat Background from Style Guidance */
        }
        .form-input-focus:focus-within {
            border-color: #3B82F6;
            box-shadow: 0 0 0 1px #3B82F6;
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-container-margin font-body-md text-on-surface">
<!-- Login Container -->
<main class="w-full max-w-[420px] animate-fade-in">
<!-- Header / Brand Section -->
<header class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary-container text-on-primary-container mb-md shadow-md">
<span class="material-symbols-outlined text-[28px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface tracking-tight">Welcome Back</h1>
<p class="font-body-md text-on-surface-variant mt-xs">Focus on what matters today.</p>
</header>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-[0_2px_4px_rgba(17,24,39,0.05)] border border-outline-variant/30">
<form action="#" class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block ml-xs" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="mail">mail</span>
<input class="w-full pl-[48px] pr-md py-3 rounded-xl border border-outline-variant bg-surface hover:bg-surface-container-low focus:outline-none focus:border-primary transition-all text-body-md" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="lock">lock</span>
<input class="w-full pl-[48px] pr-md py-3 rounded-xl border border-outline-variant bg-surface hover:bg-surface-container-low focus:outline-none focus:border-primary transition-all text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Remember Me (Bonus Interaction) -->
<div class="flex items-center space-x-sm px-xs">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary transition-all cursor-pointer" id="remember" name="remember" type="checkbox">
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Keep me logged in</label>
</div>
<!-- Login Button -->
<button class="w-full bg-[#3B82F6] hover:bg-primary-container text-white font-headline-sm text-headline-sm py-md rounded-xl shadow-[0_10px_15px_rgba(17,24,39,0.1)] transition-all active:scale-[0.98] focus:ring-4 focus:ring-primary-container/30" type="submit">
                    Login
                </button>
</form>
<!-- SSO / Divider -->

<!-- Social Logins (Bento Pattern Light) -->

</div>
<!-- Registration Link -->
<footer class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-semibold hover:underline ml-xs" href="#">Register</a>
</p>
</footer>
</main>
<!-- Visual Atmospheric Elements (Subtle Glass Circles) -->
<div class="fixed top-[-10%] right-[-10%] w-[400px] h-[400px] bg-primary-container/10 rounded-full blur-[80px] -z-10"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[300px] h-[300px] bg-secondary-container/10 rounded-full blur-[80px] -z-10"></div>
<!-- Micro-interaction Script -->
<script>
        // Simple logic for input focus states and button feedback
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-primary-container/20');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-primary-container/20');
            });
        });

        // Suppression of Shared Components as per "The Filter" rule:
        // "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Login"
    </script>


</body></html>
